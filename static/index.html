<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FamShare App</title>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div id="login-view">
            <h1>Welcome to FamShare</h1>
            <p>Please enter your name to continue.</p>
            <form id="login-form">
                <input type="text" id="username" placeholder="Your Name" required style="width: 300px; text-align: center;">
                <br><br>
                <button type="submit">Login</button>
            </form>
        </div>

        <div id="app-view" style="display:none;">
            <header style="display: flex; justify-content: space-between; align-items: center;">
                <h1><img src="/favicon/favicon_transparent.png" with="75" height="75"></src> FamShare Gallery</h1>
                <p>Welcome, <b id="welcome-user"></b>! <button id="logout-btn">Logout</button></p>
            </header>
            <hr>
            <div id="gallery-toolbar">
                <label for="filter-dropdown" style="font-weight: bold;">Filter by Owner:</label>
                <select id="filter-dropdown"></select>
            </div>
            <div id="content">
            </div>
            <form id="uploadForm">
                <h3>Upload a New Photo</h3>
                <input type="text" id="title" name="title" placeholder="Photo Title" required><br>
                <label for="is_private" style="display: inline-block; margin-bottom: 1em;">
                    <input type="checkbox" id="is_private" name="is_private">
                    Make this photo private
                </label><br>
                <input type="file" id="photo" name="photo" required><br>
                <button type="submit">Upload Photo</button>
            </form>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
